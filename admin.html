<style>
    :root {
      --bg: #0f0e0d;
      --surface: #171614;
      --surface2: #1e1c1a;
      --surface3: #252320;
      --border: rgba(255,255,255,0.08);
      --text: #e8e6e2;
      --muted: #8a8784;
      --faint: #504e4c;
      --gold: #c9952a;
      --gold-h: #e0ac3a;
      --primary: #01696f;
      --primary-h: #4f98a3;
      --danger: #a12c3b;
      --danger-h: #c94050;
      --success: #437a22;
      --radius: 0.6rem;
      --radius-lg: 1rem;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --transition: 180ms cubic-bezier(0.16,1,0.3,1);
      --font-body: 'Inter', sans-serif;
      --font-display: 'Playfair Display', serif;
    }
    [data-theme="light"] {
      --bg: #f5f3ef;
      --surface: #faf9f6;
      --surface2: #ffffff;
      --surface3: #f0ede8;
      --border: rgba(0,0,0,0.08);
      --text: #1c1a17;
      --muted: #6b6966;
      --faint: #b0ada8;
      --gold: #a87a10;
      --gold-h: #c99220;
      --primary: #01696f;
      --primary-h: #0c4e54;
      --danger: #8c1c2a;
      --danger-h: #a12c3b;
      --shadow: 0 4px 24px rgba(0,0,0,0.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
    img { display: block; max-width: 100%; }
    button { cursor: pointer; font: inherit; border: none; background: none; color: inherit; }
    input, textarea, select { font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }

    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .topbar-brand { display: flex; align-items: center; gap: 0.6rem; font-family: var(--font-display); font-size: 1.1rem; color: var(--gold); }
    .topbar-actions { display: flex; align-items: center; gap: 0.5rem; }
    .layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100dvh - 56px); }
    @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } .sidebar { display: none; } }
    .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 1.5rem 0; display: flex; flex-direction: column; gap: 0.25rem; }
    .nav-section { padding: 0.5rem 1rem 0.25rem; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--faint); }
    .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 1.25rem; font-size: 0.875rem; color: var(--muted); transition: background var(--transition), color var(--transition); cursor: pointer; border: none; background: none; width: 100%; text-align: left; }
    .nav-item i { width: 16px; text-align: center; font-size: 0.9rem; }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: rgba(1,105,111,0.15); color: var(--primary-h); border-right: 2px solid var(--primary); }
    [data-theme="light"] .nav-item.active { background: rgba(1,105,111,0.08); }
    .main { padding: 2rem; overflow-y: auto; }
    .page { display: none; }
    .page.active { display: block; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; flex-wrap: wrap; gap: 1rem; }
